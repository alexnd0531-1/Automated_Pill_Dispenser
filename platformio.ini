; Automated Pill Dispenser - Arduino Uno (ATmega328P)
; Firmware entry point: src/main.cpp

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; If using an Arduino Nano, change the board value to:
;   nanoatmega328     - classic/old bootloader
;   nanoatmega328new  - new bootloader
